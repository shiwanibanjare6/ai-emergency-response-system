services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=emergency_response
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=dev-secret-key-123456789
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - USE_SQLITE=False
      - POSTGRES_DB=emergency_response
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CORS_ALLOW_ALL_ORIGINS=True
      # To enable real Gemini analysis, uncomment and insert your Google Gemini API key:
      # - GEMINI_API_KEY=your_gemini_api_key_here
    depends_on:
      - db

volumes:
  postgres_data:
